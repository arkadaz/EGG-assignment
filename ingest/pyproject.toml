[project]
name = "egg-rag-ingest"
version = "0.1.0"
description = "Script that loads documents into pgvector for the RAG search API"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
