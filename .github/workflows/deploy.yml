name: Deploy

on: workflow_dispatch

env:
  REGION: asia-southeast1
  REGISTRY: asia-southeast1-docker.pkg.dev/egg-interview/egg-rag
  WORKLOAD_IDENTITY_PROVIDER: projects/675949307789/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: egg-rag-deployer@egg-interview.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [migrate, ingest, search]
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -t "$REGISTRY/${{ matrix.app }}:$GITHUB_SHA" ${{ matrix.app }}
      - run: docker push "$REGISTRY/${{ matrix.app }}:$GITHUB_SHA"

  terraform:
    needs: images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - run: terraform init
      - run: terraform apply -auto-approve -var "image_tag=$GITHUB_SHA"
