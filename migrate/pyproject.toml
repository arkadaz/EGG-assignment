[project]
name = "egg-rag-migrate"
version = "0.1.0"
description = "Job that applies the SQL migrations to the RAG database"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
